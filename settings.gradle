pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'chronicle'

// every Minecraft version is its own subproject under versions/<mc>
// the names here have to match the folders in versions/*
def mcVersions = ['1.21.8', '1.21.10', '1.21.11', '26.1.2', '26.2', '26.3']

mcVersions.each { mc ->
	include mc
	project(":$mc").projectDir = file("versions/$mc")
}
